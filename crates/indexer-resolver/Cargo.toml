[package]
name = "indexer-resolver"
version = "0.1.0"
edition = "2024"

[dependencies]
arc-swap = "1.7"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
thiserror = "1.0"
tokio = { version = "1.45", features = ["fs", "rt"] }
tracing = "0.1"
