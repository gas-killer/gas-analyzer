# Curated mapping from Etherscan ContractName → project_slug.
# Highest-priority resolution after the YAML overlay. Used by the auto-labeler
# when it pulls a verified contract name from Etherscan and needs to decide
# which DefiLlama project_slug it belongs to.
#
# Names are matched case-insensitively after stripping common version/role
# suffixes (V1, V2, V3, Router, Router02, RouterV2, Token, Proxy,
# Implementation). Add entries here when you see a recurring `ContractName`
# in the labeler logs that doesn't auto-resolve.
#
# Slug should match an existing entry in DefiLlama (so category metadata
# joins correctly) or in `overlay.yaml`.

