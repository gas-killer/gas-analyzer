[package]
name = "gas-analyzer-rpc"
version = "0.1.0"
edition = "2024"

[dependencies]
gas-analyzer-core = { path = "../core" }
gas-analyzer-estimator = { path = "../gas-estimator" }
alloy = { version = "1.0.37", features = ["rpc", "rpc-types", "transports"] }
alloy-eips = "1.0.37"
alloy-json-rpc = "1"
alloy-provider = { version = "1.0.37", features = ["debug-api"] }
alloy-rpc-types = "1.0.37"
revm = { version = "31.0.1", default-features = false, features = ["std"] }
anyhow = "1.0.98"

[dev-dependencies]
alloy-transport = "1"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt"] }
