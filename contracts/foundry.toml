[profile.default]
src = "src"
out = "out"
libs = ["lib"]

# The estimator artifacts in abis/ are built with these, so a rebuild matches what's committed and
# the bytecode runs on every fork the analyzer simulates from Prague on.
solc_version = "0.8.30"
evm_version = "prague"

remappings = [
    "gk/=lib/solidity-sdk/src/"
]

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
