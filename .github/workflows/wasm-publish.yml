name: Publish WASM Package

# Bumping the version in crates/wasm/Cargo.toml is the release: a push to main stages that version,
# and pushes that leave it unchanged find it already on npm and skip.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'crates/core/**'
      - 'crates/gas-estimator/**'
      - 'crates/wasm/**'
      - 'abis/**'
      - 'Cargo.lock'
      - '.github/workflows/wasm-publish.yml'

permissions:
  contents: read
  # Trusted Publishing: npm exchanges the workflow's OIDC token for a short-lived publish credential.
  id-token: write

env:
  CARGO_TERM_COLOR: always
  # Differs from the crate name: the @gas-killer scope already carries the brand.
  NPM_PACKAGE: '@gas-killer/analyzer-wasm'

# Two merges landing together would otherwise race to stage the same version.
concurrency:
  group: wasm-publish
  cancel-in-progress: false

jobs:
  # Runs first, so the many pushes that don't bump the version finish in seconds without building.
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      published: ${{ steps.version.outputs.published }}
    steps:
      - uses: actions/checkout@v4
      - name: Check whether this version is on npm
        id: version
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"$/\1/p' crates/wasm/Cargo.toml | head -1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$(npm view "$NPM_PACKAGE@$VERSION" version 2>/dev/null)" == "$VERSION" ]]; then
            echo "$NPM_PACKAGE@$VERSION is already published; skipping"
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: check
    if: needs.check.outputs.published != 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm for staged publishing
        run: npm install -g npm@latest

      - name: Install wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build WASM package
        run: wasm-pack build crates/wasm --target web --release

      - name: Configure package for npm
        run: |
          cd crates/wasm/pkg
          jq --arg name "$NPM_PACKAGE" --arg v "$VERSION" --arg repo "https://github.com/${{ github.repository }}.git" \
            '.name = $name | .version = $v | . + {"repository": {"type": "git", "url": $repo}}' \
            package.json > package.tmp.json
          mv package.tmp.json package.json

      # Staged only: the version stays hidden until a maintainer runs `npm stage approve`, which requires 2FA.
      # A staged version isn't visible to `npm view` until approved, so a push while one awaits approval
      # tries to stage it again; that refusal is expected, not a failure.
      - name: Stage on npm
        run: |
          set +e
          out=$(npm stage publish ./crates/wasm/pkg --access public --tag latest 2>&1)
          status=$?
          echo "$out"
          if [[ $status -ne 0 ]] && grep -qiE "already (been )?(staged|exists|published)|cannot publish over|EPUBLISHCONFLICT" <<<"$out"; then
            echo "::notice::$NPM_PACKAGE@$VERSION is already staged; approve or discard it on npm"
            exit 0
          fi
          exit $status
