name: Publish WASM Package

on:
  push:
    branches: [main]
    tags: ['wasm-v*']
    paths:
      - 'crates/core/**'
      - 'crates/gas-estimator/**'
      - 'crates/wasm/**'
      - 'abis/**'
      - 'Cargo.lock'
      - '.github/workflows/wasm-publish.yml'

permissions:
  contents: read
  # Trusted Publishing: npm exchanges the workflow's OIDC token for a short-lived publish credential.
  id-token: write

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm for Trusted Publishing
        run: npm install -g npm@latest

      - name: Install wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build WASM package
        run: wasm-pack build crates/wasm --target web --release --scope gas-killer

      - name: Configure package for npm
        id: pkg
        run: |
          cd crates/wasm/pkg
          VERSION=$(jq -r .version package.json)
          if [[ "$GITHUB_REF" == refs/tags/wasm-v* ]]; then
            # A release tag must match the crate version so npm and Cargo agree.
            if [[ "${GITHUB_REF_NAME#wasm-v}" != "$VERSION" ]]; then
              echo "Tag $GITHUB_REF_NAME does not match crate version $VERSION" >&2
              exit 1
            fi
            echo "dist_tag=latest" >> "$GITHUB_OUTPUT"
          else
            VERSION="$VERSION-$(git rev-parse --short HEAD)"
            echo "dist_tag=next" >> "$GITHUB_OUTPUT"
          fi
          jq --arg v "$VERSION" --arg repo "https://github.com/${{ github.repository }}.git" \
            '.version = $v | . + {"repository": {"type": "git", "url": $repo}}' \
            package.json > package.tmp.json
          mv package.tmp.json package.json

      - name: Publish to npm
        run: npm publish ./crates/wasm/pkg --access public --tag ${{ steps.pkg.outputs.dist_tag }}
